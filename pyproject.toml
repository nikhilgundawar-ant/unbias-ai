[project]
name = "unbias-ai"
version = "0.0.1"
description = "Reduce tone- and pressure-driven sycophancy in LLM answers, with a pre-registered eval suite."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21"]

[project.scripts]
unbias = "unbias.cli:main"

[project.optional-dependencies]
evals = ["jsonschema>=4.21"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.21",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unbias"]

[tool.hatch.build.targets.wheel.force-include]
"evals/fixtures/h2_dev.jsonl" = "unbias/_data/h2_dev.jsonl"
"evals/fixtures/seed_dev.jsonl" = "unbias/_data/seed_dev.jsonl"
"evals/fixtures/schema.json" = "unbias/_data/schema.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]  # fixtures legitimately use × and curly quotes

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
